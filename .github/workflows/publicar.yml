name: publicar video

on:
  schedule:
    - cron: "7 2 * * *"
    - cron: "7 7 * * *"
    - cron: "7 12 * * *"
    - cron: "7 17 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      privacidad:
        description: "Privacidad (private, unlisted o public)"
        default: "private"
        type: choice
        options: [private, unlisted, public]
      cantidad:
        description: "Cuantos videos crear"
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: publicar-video
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar y publicar
        env:
          PRIVACIDAD: ${{ github.event.inputs.privacidad || 'private' }}
          CANTIDAD: ${{ github.event.inputs.cantidad || '1' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python generar_video.py
